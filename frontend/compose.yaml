services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "5173:80"
    restart: unless-stopped
    # Uncomment if this frontend needs to talk to a backend service
    # that's also managed by docker compose (e.g. from another compose file
    # or the same one), so both containers share a network:
    # networks:
    #   - app-network

# networks:
#   app-network:
#     external: true   # or drop `external: true` if defined in the same file